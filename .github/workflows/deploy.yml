# main 에 push → 빌드 · 검사 → GitHub Pages 배포. v* 태그 → 오프라인용 단일 HTML 을 Release 에 첨부.
# 내용은 kit 의 재사용 워크플로에 있다. kit 을 올리면 아래 @태그도 같이 올린다.
# 처음 한 번: 리포 Settings > Pages > Source 를 GitHub Actions 로 바꾼다.
name: Build & Deploy

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages:
    uses: KooHoo-Dev/edu-lecture-gallery-kit/.github/workflows/pages.yml@v0.1.1
    with:
      release-name: PatternGallery
      title: Pattern Gallery
